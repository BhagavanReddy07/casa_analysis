name: Deploy to EC2

# Every push to main redeploys. workflow_dispatch lets you redeploy the
# current main by hand from the Actions tab without an empty commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys overwrite each other mid-rsync.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          # Pin the host key instead of disabling checking, so a hijacked
          # DNS/IP cannot silently receive the deploy.
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync code
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude '.github' \
            --exclude 'videos' --exclude '.venv' \
            --exclude '__pycache__' --exclude 'sperm_pose_baseline' \
            -e "ssh -i ~/.ssh/deploy.pem -o StrictHostKeyChecking=yes" \
            ./ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/sperm_CASA/"
          # --delete removes files deleted from the repo, but rsync protects
          # excluded paths from deletion, so videos/ on the server is safe.

      - name: Install dependencies and restart
        run: |
          ssh -i ~/.ssh/deploy.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" '
            set -e
            cd ~/sperm_CASA
            .venv/bin/pip install -q -r requirements.txt

            # The instance type gets switched between CPU and GPU sizes, and a
            # CPU-only torch wheel on a GPU box runs silently at a twentieth of
            # the speed — nothing fails, it is just slow. So the deploy checks
            # the hardware against the wheel and repairs the mismatch itself
            # rather than relying on anyone remembering. The CUDA build is
            # correct on both: on a CPU instance it simply reports no GPU.
            if nvidia-smi >/dev/null 2>&1 && \
               .venv/bin/python -c "import torch,sys; sys.exit(0 if \"+cpu\" in torch.__version__ else 1)"; then
              echo "GPU present but torch is the CPU build - reinstalling with CUDA"
              .venv/bin/pip install -q --force-reinstall torch torchvision \
                --index-url https://download.pytorch.org/whl/cu124
            fi
            .venv/bin/python -c "import torch; print(\"torch\", torch.__version__, \"cuda:\", torch.cuda.is_available())"

            sudo systemctl restart casa
          '

      - name: Verify the deploy is actually serving
        run: |
          # Fail the run if the app does not come back — a green tick on a
          # dead service is worse than a red one.
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 \
               "http://${{ secrets.EC2_HOST }}:8501/_stcore/health" >/dev/null; then
              echo "healthy after $((i * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "service did not become healthy within 120s"
          ssh -i ~/.ssh/deploy.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            'sudo journalctl -u casa -n 40 --no-pager'
          exit 1

      - name: Re-analyse the videos this push outdated
        run: |
          # Detached on purpose: a clip takes ~15-20 min on the instance's two
          # vCPUs and the deploy must not sit there for an hour. Results appear
          # in the dashboard clip by clip as each one finishes.
          # flock -n makes a second deploy skip rather than start a rival
          # rebuild over the same files, and nice keeps the app responsive
          # while it runs. main.py only re-analyses clips whose stored
          # fingerprint differs from the current detection/tracking/CASA code,
          # so a docs-only push rebuilds nothing.
          ssh -i ~/.ssh/deploy.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" '
            cd ~/sperm_CASA
            setsid flock -n videos/rebuild.lock \
              nice -n 10 .venv/bin/python main.py --rebuild \
              >> videos/rebuild.log 2>&1 < /dev/null &
            echo "rebuild dispatched — tail ~/sperm_CASA/videos/rebuild.log to watch"
          '
